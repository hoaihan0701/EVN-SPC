tra_cuu_san_luong_theo_ngay:
  name: Tra cứu sản lượng theo khoảng ngày
  description: Tra cứu tổng sản lượng điện tiêu thụ trong khoảng thời gian chỉ định.
  fields:
    tu_ngay:
      name: Từ ngày
      description: Định dạng DD/MM/YYYY hoặc YYYY-MM-DD
      required: true
      example: "01/10/2026"
      selector:
        text:
    den_ngay:
      name: Đến ngày
      description: Định dạng DD/MM/YYYY hoặc YYYY-MM-DD
      required: true
      example: "25/10/2026"
      selector:
        text:

tra_cuu_hoa_don_theo_thang:
  name: Tra cứu hóa đơn theo tháng
  description: Lấy thông tin số tiền và số hóa đơn tiền điện theo kỳ, tháng, năm.
  fields:
    ky:
      name: Kỳ
      description: Kỳ ghi chỉ số (thường là 1)
      required: false
      default: 1
      selector:
        number:
          mode: box
    thang:
      name: Tháng
      description: Tháng cần tra cứu
      required: true
      example: 10
      selector:
        number:
          min: 1
          max: 12
          mode: box
    nam:
      name: Năm
      description: Năm cần tra cứu
      required: true
      example: 2026
      selector:
        number:
          mode: box
